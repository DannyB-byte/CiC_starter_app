name: Chemo in Comfort Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript validation
        run: npm run typecheck

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Bundle validation
        run: node scripts/check-bundle.mjs

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Browser regression tests
        run: npx playwright test --config=playwright.production.config.ts

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Chemo in Comfort
        id: deployment
        uses: actions/deploy-pages@v4